name: Data · MLB

# Rebuilds MLB stats from the MLB Stats API and publishes them to the `data` branch.
# Does NOT redeploy the site (the site reads the data branch directly).

on:
  schedule:
    - cron: "0 10 * 3-11 *"       # daily 10:00 UTC, March–November
    - cron: "0 10 * 1,2,12 2"     # Tuesdays, December–February
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild every season (not just the current one)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scripts/refresh-mlb.mjs", "scripts/lib.mjs", "scripts/publish-data.sh", ".github/workflows/data-mlb.yml"]

permissions:
  contents: write

concurrency:
  group: data-branch   # shared by every sport's workflow so pushes to `data` never race
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore already-published seasons
        run: |
          git fetch --depth=1 origin data || exit 0
          mkdir -p public/data
          git --work-tree=public/data checkout origin/data -- mlb 2>/dev/null || true
          git reset -q
      - name: Build MLB data
        run: node scripts/refresh-mlb.mjs ${{ inputs.full && '--all' || '' }}
      - name: Publish to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-data.sh mlb
