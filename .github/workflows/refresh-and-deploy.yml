name: Refresh stats and deploy

on:
  push:
    branches: [main]
  schedule:
    # Tuesday 15:00 UTC (after Monday Night Football + nflverse's overnight update)
    # and Thursday 12:00 UTC (picks up late PFR pressure/snap corrections before TNF).
    - cron: "0 15 * * 2"
    - cron: "0 12 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build NFL data from nflverse
        run: node scripts/refresh-nfl.mjs --all
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
