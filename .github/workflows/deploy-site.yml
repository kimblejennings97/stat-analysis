name: Deploy site

# Publishes public/ to GitHub Pages when the site code changes. Data is not part of this deploy:
# the data-<sport>.yml workflows publish it to the `data` branch, which the site reads directly.

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
